[package]
name = "docker-workbench"
version = "0.1.5"
edition = "2021"
description = "Cross-platform Docker management workbench"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# Enable OS proxy discovery for the updater's shared reqwest client.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
