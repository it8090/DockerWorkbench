name: 功能建议 / Feature request
description: 描述使用场景与希望的改进 / Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 请避免包含真实连接与业务配置 / Omit real connection and business configuration.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充说明 / Alternatives and context
